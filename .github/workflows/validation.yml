name: Validation against R

# Parity tests are slow (R install + package install + cross-language calls).
# We run them on PR to main and on push to main, but not on every commit to
# feature branches. Enable manually via workflow_dispatch when iterating.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Numerical parity vs R GeoLift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # R >= 4.5: modern rpy2 (unpinned rpy2>=3.5) binds the R_getVar
          # symbol, introduced in R 4.5.0 — same constraint as augsynth-py's
          # validation workflow, where it is documented in detail.
          r-version: "4.5"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install R dependencies
        # remotes::install_github reads GITHUB_PAT to authenticate against the
        # GitHub API; GITHUB_TOKEN lifts the anonymous 60 req/hr rate limit.
        # Only GeoLift is needed here — geoexp does not compare estimator
        # internals (those parity tests live in augsynth-py).
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("facebookincubator/GeoLift", upgrade = "never")'

      - name: Install Python package with validation extras
        run: |
          pip install -e ".[validation,dev]"

      - name: Run parity tests
        run: pytest tests/validation_against_r/ -v
