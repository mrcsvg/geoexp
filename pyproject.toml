[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "geoexp"
description = "Geo-experiment design on top of augsynth-py: market selection, power-based design ranking, and experiment reporting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "geoexp contributors" },
]
keywords = [
    "geo-experiments",
    "market-selection",
    "causal-inference",
    "synthetic-control",
    "marketing-science",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dynamic = ["version"]

# Only what geoexp imports directly; floors low, no caps — augsynth-py's
# compatibility policy applies verbatim (see docs/geoexp-bootstrap-spec.md §5).
# No direct cvxpy/scipy: they arrive transitively via augsynth-py and geoexp
# never calls them.
dependencies = [
    # The release carrying the accepted power-API contract bundle
    # (docs/power-api-contract-review.md in augsynth-py). geoexp is written
    # against that frozen surface — do not lower this floor to 0.4.x.
    "augsynth-py>=0.5.0",
    "numpy>=1.26",
    "polars>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
validation = [
    # Required to run tests/validation_against_r/ (GeoLift parity oracle).
    # Also requires R (>=4.5) and the GeoLift R package installed on the
    # system; see .github/workflows/validation.yml.
    # No pandas/pyarrow: tests/validation_against_r/_r_frames.py converts
    # R data.frames to Polars directly.
    "rpy2>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/mrcsvg/geoexp"
Issues = "https://github.com/mrcsvg/geoexp/issues"
Changelog = "https://github.com/mrcsvg/geoexp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/geoexp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geoexp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CLAUDE.md",
]

# ---------------------------------------------------------------------------
# Ruff: lint + format (ported from augsynth-py — keep the repos in lockstep)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
    "NPY", # numpy-specific
    "PD",  # pandas/polars
    "D",   # pydocstyle
]
ignore = [
    "D100",  # missing docstring in public module — ok for internal modules
    "D104",  # missing docstring in public package — ok for __init__.py
    "D105",  # missing docstring in magic method
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # don't require docstrings in tests

# ---------------------------------------------------------------------------
# Mypy: strict type checking on src/, lenient on tests/
# ---------------------------------------------------------------------------
# python_version targets 3.12 (not the 3.11 floor) for the same reason as
# augsynth-py: modern numpy stubs use PEP 695 `type` statements that mypy
# rejects under a 3.11 target. Our code stays 3.11-compatible (ruff
# target-version py311, unit matrix runs 3.11).
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party libs without type stubs.
module = ["rpy2", "rpy2.*", "joblib", "joblib.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that take more than a few seconds",
    "requires_r: tests that need R + GeoLift installed (validation_against_r)",
    "requires_r_pkg(*pkgs): test needs the named R package(s); skipped otherwise",
]
filterwarnings = [
    "error",
    # rpy2 emits deprecation warnings we cannot fix
    "ignore::DeprecationWarning:rpy2.*",
]
